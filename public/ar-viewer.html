<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Görüntüleyici</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0a0a0a; font-family: system-ui, sans-serif; overflow: hidden; }

    #layout { display: flex; flex-direction: column; height: 100dvh; }

    #header {
      display: flex; align-items: center; gap: 12px;
      padding: 16px; flex-shrink: 0;
    }
    #back-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.1); border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
    }
    #back-btn svg { width: 20px; height: 20px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    #product-name { color: white; font-weight: 600; font-size: 16px; }
    #subtitle { color: rgba(255,255,255,0.35); font-size: 12px; margin-top: 2px; }

    #viewer-wrap { flex: 1; padding: 0 16px; min-height: 0; }

    model-viewer {
      width: 100%; height: 100%;
      background: #111;
      border-radius: 20px;
      --progress-bar-color: var(--color);
    }

    #footer { flex-shrink: 0; padding: 16px; padding-bottom: 28px; }
    #ar-btn {
      width: 100%; padding: 16px; border: none; border-radius: 16px;
      font-size: 16px; font-weight: 700; color: white;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      cursor: pointer;
    }
    #ar-btn svg { width: 22px; height: 22px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    #hint { text-align: center; font-size: 12px; color: rgba(255,255,255,0.22); margin-top: 10px; }
  </style>
</head>
<body>
  <div id="layout">
    <div id="header">
      <button id="back-btn" onclick="history.back()">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div>
        <div id="product-name">Yükleniyor...</div>
        <div id="subtitle">3D Model · Döndürerek incele</div>
      </div>
    </div>

    <div id="viewer-wrap">
      <model-viewer
        id="mv"
        alt="AR Model"
        ar
        ar-modes="scene-viewer quick-look webxr"
        camera-controls
        auto-rotate
        shadow-intensity="1"
      >
        <button slot="ar-button" id="slot-ar-btn" style="display:none"></button>
      </model-viewer>
    </div>

    <div id="footer">
      <button id="ar-btn" onclick="activateAR()">
        <svg viewBox="0 0 24 24"><polyline points="3 7 3 3 7 3"/><polyline points="17 3 21 3 21 7"/><polyline points="21 17 21 21 17 21"/><polyline points="7 21 3 21 3 17"/></svg>
        Masanda Gör
      </button>
      <p id="hint">iPhone → Safari · Android → Chrome</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const src   = params.get('src')   || '';
    const name  = decodeURIComponent(params.get('name')  || 'Ürün');
    const color = params.get('color') || '#f97316';

    document.getElementById('product-name').textContent = name;
    document.getElementById('ar-btn').style.background = color;
    document.documentElement.style.setProperty('--color', color);
    document.title = name + ' · AR';

    const mv = document.getElementById('mv');
    const arBtn = document.getElementById('ar-btn');
    mv.setAttribute('src', src);

    // Model yüklenince AR hazır mı kontrol et
    mv.addEventListener('load', function() {
      document.getElementById('subtitle').textContent = '3D Model · Döndürerek incele';
      // iOS için USDZ dönüşümü biraz zaman alabilir
      setTimeout(function() {
        if (!mv.canActivateAR) {
          document.getElementById('hint').textContent = 'AR bu cihaz/tarayıcıda desteklenmiyor · iPhone → Safari, Android → Chrome';
          arBtn.style.opacity = '0.4';
        }
      }, 2000);
    });

    mv.addEventListener('error', function() {
      document.getElementById('subtitle').textContent = 'Model yüklenemedi';
    });

    // AR oturumu açıldığında/kapandığında
    mv.addEventListener('ar-status', function(e) {
      console.log('AR status:', e.detail.status);
    });

    function activateAR() {
      if (mv.canActivateAR) {
        mv.activateAR();
      } else {
        document.getElementById('hint').textContent = 'AR hazırlanıyor, birkaç saniye bekle ve tekrar dene...';
        // 2 saniye sonra tekrar dene
        setTimeout(function() {
          if (mv.canActivateAR) mv.activateAR();
        }, 2000);
      }
    }
  </script>
</body>
</html>
